name: Build NBA Center frontend

on:
  push:
    branches:
      - phase-1-foundation
    paths-ignore:
      - custom_components/nba/www/nba-center-card.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-1-foundation
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build bundled Lit card
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit generated frontend bundle
        run: |
          if git diff --quiet -- custom_components/nba/www/nba-center-card.js; then
            echo "Frontend bundle is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/nba/www/nba-center-card.js
          git commit -m "build(frontend): bundle NBA Center Lit card"
          git push origin HEAD:phase-1-foundation
