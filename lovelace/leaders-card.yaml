# Top 10 des meilleurs marqueurs (moyenne par match), avec podium pour les 3 premiers.
# Pour les autres categories, remplacez le capteur et le titre :
#   sensor.nba_meilleurs_rebondeurs / sensor.nba_meilleurs_passeurs
#   sensor.nba_meilleurs_intercepteurs / sensor.nba_meilleurs_contreurs
type: markdown
title: "🏆 Meilleurs marqueurs"
content: >-
  {% set rows = state_attr('sensor.nba_meilleurs_marqueurs', 'leaders') or [] %}
  {% set medals = ['🥇', '🥈', '🥉'] %}
  {% set colors = ['#FFD700', '#C0C0C0', '#CD7F32'] %}
  {% if rows | length >= 3 %}
  <table width="100%" style="border-collapse:separate;border-spacing:6px 0;text-align:center">
  <tr style="vertical-align:bottom">
  {% for i in [0, 1, 2] %}
  {% set p = rows[i] %}
  <td style="width:33%;padding:8px 2px;border-radius:12px;background:rgba(128,128,128,.10);border-top:4px solid {{ colors[i] }}">
  <div style="font-size:{{ 26 if i == 0 else 20 }}px">{{ medals[i] }}</div>
  <img src="{{ p.headshot }}" width="{{ 80 if i == 0 else 64 }}" style="border-radius:50%;border:3px solid {{ colors[i] }}">
  <div style="font-weight:bold;font-size:{{ 14 if i == 0 else 12 }}px;margin-top:4px">{{ p.player }}</div>
  <div style="font-size:11px;opacity:.6">{{ p.team }}</div>
  <div style="font-size:{{ 24 if i == 0 else 18 }}px;font-weight:bold;color:{{ colors[i] }}">{{ p.value }}</div>
  </td>
  {% endfor %}
  </tr>
  </table>
  <table width="100%" style="border-collapse:collapse;font-size:14px;margin-top:10px">
  {% for p in rows[3:] -%}
  <tr style="border-bottom:1px solid rgba(128,128,128,.2)">
  <td style="padding:4px;width:24px;text-align:center;opacity:.7">{{ p.rank }}</td>
  <td style="width:40px"><img src="{{ p.headshot }}" width="32" style="vertical-align:middle;border-radius:50%"></td>
  <td><b>{{ p.player }}</b> <small style="opacity:.6">{{ p.team }}</small></td>
  <td style="text-align:right;font-weight:bold">{{ p.value }}</td>
  </tr>
  {% endfor %}
  </table>
  {% else %}
  Donnees indisponibles pour le moment.
  {% endif %}
