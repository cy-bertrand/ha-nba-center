# Cinq derniers matchs : un clic ouvre Plus d'informations du capteur.
# Prérequis : custom:button-card (HACS > Interface).
# Adaptez l'entité ci-dessous à l'équipe favorite souhaitée.
type: vertical-stack
cards:
  - type: markdown
    title: 🏀 Derniers matchs
    content: >-
      {% set s = states.sensor.los_angeles_lakers_derniers_matchs %}
      {% if s %}<div style="text-align:center"><img src="{{ s.attributes.team_logo }}" width="50">
      <br><b>Série : {{ s.state }}</b></div>{% else %}Capteur introuvable : adaptez son nom.{% endif %}
  - type: custom:button-card
    entity: sensor.los_angeles_lakers_derniers_matchs
    show_name: false
    show_icon: false
    show_state: false
    styles:
      card:
        - padding: 0
        - background: none
        - box-shadow: none
      grid:
        - grid-template-areas: '"row1" "row2" "row3" "row4" "row5"'
        - grid-template-columns: 1fr
        - grid-template-rows: repeat(5, min-content)
      custom_fields:
        row1: [width: 100%]
        row2: [width: 100%]
        row3: [width: 100%]
        row4: [width: 100%]
        row5: [width: 100%]
    custom_fields:
      row1: >
        [[[
          const g=(entity.attributes.games||[])[0];
          return g ? `<div style="display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid rgba(128,128,128,.25)"><b style="color:${g.result==='V'?'#43a047':'#e53935'}">${g.result}</b><img src="${g.opp_logo||''}" width="28"><span style="flex:1">${g.home_away} ${g.opp_abbr||''}<br><small>${g.day||''}</small></span><b>${g.team_score} - ${g.opp_score}</b></div>` : '';
        ]]]
      row2: >
        [[[
          const g=(entity.attributes.games||[])[1];
          return g ? `<div style="display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid rgba(128,128,128,.25)"><b style="color:${g.result==='V'?'#43a047':'#e53935'}">${g.result}</b><img src="${g.opp_logo||''}" width="28"><span style="flex:1">${g.home_away} ${g.opp_abbr||''}<br><small>${g.day||''}</small></span><b>${g.team_score} - ${g.opp_score}</b></div>` : '';
        ]]]
      row3: >
        [[[
          const g=(entity.attributes.games||[])[2];
          return g ? `<div style="display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid rgba(128,128,128,.25)"><b style="color:${g.result==='V'?'#43a047':'#e53935'}">${g.result}</b><img src="${g.opp_logo||''}" width="28"><span style="flex:1">${g.home_away} ${g.opp_abbr||''}<br><small>${g.day||''}</small></span><b>${g.team_score} - ${g.opp_score}</b></div>` : '';
        ]]]
      row4: >
        [[[
          const g=(entity.attributes.games||[])[3];
          return g ? `<div style="display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid rgba(128,128,128,.25)"><b style="color:${g.result==='V'?'#43a047':'#e53935'}">${g.result}</b><img src="${g.opp_logo||''}" width="28"><span style="flex:1">${g.home_away} ${g.opp_abbr||''}<br><small>${g.day||''}</small></span><b>${g.team_score} - ${g.opp_score}</b></div>` : '';
        ]]]
      row5: >
        [[[
          const g=(entity.attributes.games||[])[4];
          return g ? `<div style="display:flex;align-items:center;gap:10px;padding:10px 6px"><b style="color:${g.result==='V'?'#43a047':'#e53935'}">${g.result}</b><img src="${g.opp_logo||''}" width="28"><span style="flex:1">${g.home_away} ${g.opp_abbr||''}<br><small>${g.day||''}</small></span><b>${g.team_score} - ${g.opp_score}</b></div>` : '';
        ]]]
    tap_action:
      action: more-info
